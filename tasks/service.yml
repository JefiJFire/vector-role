---
- name: Check if systemd is available
  ansible.builtin.command: systemctl --version
  register: systemd_check
  changed_when: false
  failed_when: false

- name: Ensure Vector service is {{ vector_service_state }} and enabled={{ vector_service_enabled }}
  ansible.builtin.service:
    name: "{{ vector_service_name }}"
    state: "{{ vector_service_state }}"
    enabled: "{{ vector_service_enabled }}"
  become: true
  when: systemd_check.rc == 0
