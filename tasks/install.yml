---
- name: Install Vector on Debian/Ubuntu
  when: ansible_os_family == "Debian"
  block:
    - name: Ensure dependencies are installed (Debian)
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: true
      become: true

    - name: Download Vector .deb package
      ansible.builtin.get_url:
        url: "https://github.com/vectordotdev/vector/releases/download/v{{ vector_version }}/vector_{{ vector_version }}-1_amd64.deb"
        dest: "/tmp/vector_{{ vector_version }}_amd64.deb"
        mode: "0644"
      become: true

    - name: Install Vector .deb package
      ansible.builtin.apt:
        deb: "/tmp/vector_{{ vector_version }}_amd64.deb"
        state: present
      become: true
      notify: restart vector

- name: Install Vector on RedHat/Rocky
  when: ansible_os_family == "RedHat"
  block:
    - name: Ensure dependencies are installed (RedHat)
      ansible.builtin.yum:
        name:
          - curl
          - tar
        state: present
      become: true

    - name: Download Vector musl archive (static binary, no glibc deps)
      ansible.builtin.get_url:
        url: "https://github.com/vectordotdev/vector/releases/download/v{{ vector_version }}/vector-{{ vector_version }}-x86_64-unknown-linux-musl.tar.gz"
        dest: "/tmp/vector-{{ vector_version }}-musl.tar.gz"
        mode: "0644"
      become: true

    - name: Extract Vector archive
      ansible.builtin.unarchive:
        src: "/tmp/vector-{{ vector_version }}-musl.tar.gz"
        dest: "/tmp/"
        remote_src: true
      become: true

    - name: Install Vector binary
      ansible.builtin.copy:
        src: "/tmp/vector-x86_64-unknown-linux-musl/bin/vector"
        dest: /usr/bin/vector
        mode: "0755"
        remote_src: true
      become: true
      notify: restart vector

    - name: Create Vector systemd unit file
      ansible.builtin.copy:
        dest: /etc/systemd/system/vector.service
        mode: "0644"
        content: |
          [Unit]
          Description=Vector - Log aggregation tool
          Documentation=https://vector.dev
          After=network-online.target
          Wants=network-online.target

          [Service]
          User={{ vector_user }}
          Group={{ vector_group }}
          ExecStartPre=/usr/bin/vector validate --no-environment {{ vector_config_file }}
          ExecStart=/usr/bin/vector --config {{ vector_config_file }}
          ExecReload=/bin/kill -HUP $MAINPID
          Restart=on-failure
          RestartSec=5s
          RuntimeDirectory=vector
          RuntimeDirectoryMode=0750

          [Install]
          WantedBy=multi-user.target
      become: true
      notify:
        - reload systemd
        - restart vector

- name: Ensure Vector group exists
  ansible.builtin.group:
    name: "{{ vector_group }}"
    system: true
    state: present
  become: true

- name: Ensure Vector user exists
  ansible.builtin.user:
    name: "{{ vector_user }}"
    group: "{{ vector_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present
  become: true

- name: Ensure required directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ vector_user }}"
    group: "{{ vector_group }}"
    mode: "0750"
  loop:
    - "{{ vector_config_dir }}"
    - "{{ vector_data_dir }}"
    - "{{ vector_log_dir }}"
  become: true
